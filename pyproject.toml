[project]
name = "larkbot"
version = "0.1.0"
description = "GitHub -> 飞书(Lark) 通知机器人：webhook + 轮询回退，按群订阅仓库"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "tzdata>=2024.1",
    "uvicorn>=0.32",
]

[project.scripts]
larkbot = "larkbot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/larkbot"]

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:larkbot.*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", ".venv", "data"]
# 让 pyright 找到项目 venv，否则第三方包全是 reportMissingImports 误报
venvPath = "."
venv = ".venv"
# standard 模式（比 basic 严、比 strict 实用）；pythonVersion 钉在最低支持版本，
# 这样误用 3.12+ 才有的 API 会在本地就被发现
pythonVersion = "3.11"
typeCheckingMode = "standard"
